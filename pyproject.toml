[tool.pytest.ini_options]
# tests/ lives outside the `app` package, so the repo root must be importable
# for `from app... import ...` to resolve without installing the project.
pythonpath = ["."]
testpaths = ["tests"]
# E2E tests boot a real uvicorn process and run real BERT inference, so they
# need torch and take minutes. Excluded by default; the CI e2e job (main
# branch only) opts in with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = ["e2e: end-to-end test against a live server and the real model"]

[tool.ruff]
# alembic/versions holds autogenerated migration scripts (Alembic's own
# boilerplate, not hand-written) -- not worth holding to the same lint bar.
exclude = ["venv", "alembic/versions"]

[tool.ruff.lint]
# E402 (module import not at top of file) is not on by default, but conftest.py
# genuinely depends on import order -- it must patch nlp.pipeline before
# importing main, or every test run loads real BERT weights. Enabling it makes
# the `# noqa: E402` comments there meaningful rather than "unused".
extend-select = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as function calls in argument
# defaults (`db: Session = Depends(get_db)`). That is the canonical idiom, not
# the mutable-default bug B008 exists to catch, so exempt these callables.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]
