name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # requirements-test.txt omits torch (~326MB + deps), which the suite
      # never needs -- conftest.py stubs the model pipeline. See that file.
      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: pytest -v
