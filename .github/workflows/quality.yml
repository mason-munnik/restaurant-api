name: Code Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: ruff's default rule set expands between releases, so an
      # unpinned install would turn unrelated commits red.
      - name: Install ruff
        run: pip install ruff==0.16.2

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format check
        if: always()
        run: ruff format --check --diff .
